[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "bankingoperationswidget"
version = "0.1.0"
description = "Банковский виджет операций"
authors = [
    { name = "Vladimir Vladimirovich Smirnov", email = "hpl1018@mail.ru" }
]
readme = "README.md"
requires-python = ">=3.12,<4.0"

[tool.poetry.group.dev.dependencies]
flake8 = ">=7.3.0,<8.0.0"
mypy = ">=2.3.1,<3.0.0"
black = ">=26.5.1,<27.0.0"
isort = ">=9.0.1,<10.0.0"
pytest = ">=9.1.1,<10.0.0"

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict = true
warn_return_any = true
warn_unreachable = true
exclude = ['venv', 'test']

[flake8]
max-line-length = 119
ignore = ['E203', 'W503']
exclude = ['.git', '__pycharm__', 'venv', '.venv']

[tool.black]
line-length = 119
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
  | foo.py
)
'''

[tool.isort]
line_length = 119
skip_glob = [".mypy_cache/**", "venv/**", ".venv/**", "__pycharm__/**", ".git/**"]

[tool.pytest.ini_options]
addopts = "-v --tb=short"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.poetry.group.test.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
